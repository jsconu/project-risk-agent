[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-risk-agent"
version = "0.1.0"
description = "An open-source AI agent for evidence-backed project risk intelligence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
project-risk-agent = "project_risk_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
