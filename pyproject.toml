[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-risk-agent"
version = "0.3.0"
description = "An open-source AI agent for evidence-backed project risk intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Project Risk Agent contributors" },
]
keywords = [
  "project-management",
  "risk-management",
  "ai-agent",
  "llm",
  "jira",
  "slack",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/jsconu/project-risk-agent"
Repository = "https://github.com/jsconu/project-risk-agent"
Changelog = "https://github.com/jsconu/project-risk-agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/jsconu/project-risk-agent/issues"

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "httpx>=0.27,<1.0",
]
chat = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]
openai = [
  "openai>=1.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6,<0.7",
]

[project.scripts]
project-risk-agent = "project_risk_agent.cli:main"
project-risk-agent-chat = "project_risk_agent.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_risk_agent = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
